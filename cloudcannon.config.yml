# CloudCannon editor setup: lets you add products from a form instead of editing files.
# https://cloudcannon.com/documentation/articles/setting-global-configuration/?ssg=Jekyll

collections_config:
  products:
    path: _products
    output: true
    name: Products
    icon: sell
    _enabled_editors:
      - data
      - content
    schemas:
      sale:
        path: .cloudcannon/schemas/sale.md
        name: Item I'm selling
      affiliate:
        path: .cloudcannon/schemas/affiliate.md
        name: Affiliate deal
  pages:
    path: ""
    filter: strict
    output: true
    name: Pages

_inputs:
  type:
    type: select
    comment: sale = sold by you through Stripe. affiliate = deal at another store.
    options:
      values: [sale, affiliate]
  status:
    type: select
    comment: Switch to "sold" after the Stripe payment comes in.
    options:
      values: [available, sold]
  condition:
    type: select
    options:
      values: [Like new, Excellent, Good, Fair]
  brand:
    type: text
    comment: Optional. Shown on the item page and used by search and the brand logos on the home page.
  category:
    type: text
    comment: Used for the filter buttons, e.g. Phones, Laptops, Audio.
  price:
    type: number
  compare_at:
    type: number
    label: Original price
    comment: Optional. Shown crossed out next to your price.
  anycart_id:
    type: text
    label: AnyCart product ID
    comment: Must match the product ID in your AnyCart dashboard (set stock to 1 there for one-off items).
  affiliate_url:
    type: url
    label: Affiliate link
    comment: Amazon needs your Associates link. Any other store can be a plain product link if Sovrn or Skimlinks is set up in _config.yml.
  store:
    type: text
    comment: Store name shown on the button, e.g. Amazon.
  expires:
    type: date
    comment: Optional. The deal is hidden on the next build after this date.
  images:
    type: array
    comment: The first image is the main photo.
  images[*]:
    type: image
  highlights:
    type: array

  # Tracking (_config.yml)
  google_analytics:
    type: text
    comment: GA4 measurement ID, e.g. G-XXXXXXXXXX. Leave empty to turn off.
  facebook_pixel:
    type: text
    comment: Meta Pixel ID (numbers only). Leave empty to turn off.
  clarity_id:
    type: text
    comment: Microsoft Clarity project ID. Leave empty to turn off.

  # SEO front matter (any page)
  description:
    type: textarea
    comment: Search result snippet. Aim for 150-160 characters, written for people.
  breadcrumb_title:
    type: text
    comment: Short label for breadcrumbs. Defaults to the title.
  noindex:
    type: switch
    comment: Hide this page from search engines (thank-you and utility pages).
  canonical_url:
    type: url
    comment: Only if this page's content lives at another URL.
  lede:
    type: textarea
    comment: Short subtitle shown under the page heading.

  # Page front matter
  hero:
    type: array
    comment: Home page hero slides.
    options:
      structures: _structures.hero_slide
  features:
    type: array
    options:
      structures: _structures.feature
  buttons:
    type: array
    options:
      structures: _structures.button
  brands:
    type: multiselect
    options:
      values: [apple, samsung, sony, canon, motorola]
  image:
    type: image
  show_disclosure:
    type: switch
  updated:
    type: date
    label: Last updated
    comment: Shown under the heading on policy pages. Change it whenever you edit the policy.

_structures:
  hero_slide:
    values:
      - label: Slide
        value: { kicker: "", title: "", image: "", link: /shop/, button: Shop now }
  feature:
    values:
      - label: Feature
        value: { icon: ci-check-shield, title: "", text: "" }
  button:
    values:
      - label: Button
        value: { label: "", url: /, style: btn-primary }

paths:
  uploads: assets/uploads
timezone: America/Chicago

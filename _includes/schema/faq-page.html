{% comment %}
  Reads the a_plain twin field from _data/faqs.yml (plain text for machines;
  the page renders the HTML `a` field). Emits nothing while the file is empty.
{% endcomment %}
{%- if site.data.faqs and site.data.faqs.size > 0 -%}
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"FAQPage",
  "@id":"{{ canonical_url }}#faq",
  "mainEntity":[
    {% for f in site.data.faqs %}
    {"@type":"Question",
     "name":{{ f.q | strip | jsonify }},
     "acceptedAnswer":{"@type":"Answer","text":{{ f.a_plain | default: f.a | strip_html | strip_newlines | strip | jsonify }}}}
    {%- unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{%- endif -%}

{%- assign p = include.product -%}
{%- if p.status == "sold" -%}
  <span class="badge text-bg-secondary {{ include.class }}">Sold</span>
{%- elsif p.type == "affiliate" -%}
  <span class="badge text-bg-info {{ include.class }}">Deal @ {{ p.store }}</span>
{%- elsif p.compare_at -%}
  {%- assign off = p.price | times: 100.0 | divided_by: p.compare_at | minus: 100 | round | abs -%}
  <span class="badge text-bg-danger {{ include.class }}">-{{ off }}%</span>
{%- endif -%}

{%- assign p = include.product -%}
{%- capture pct -%}{% include discount.html product=p %}{%- endcapture -%}
{%- if p.status == "sold" -%}
  <span class="badge text-bg-secondary {{ include.class }}">Sold</span>
{%- elsif p.type == "affiliate" -%}
  <span class="d-flex flex-column align-items-start gap-1 {{ include.class }}"><span class="badge text-bg-info">Deal @ {{ p.store }}</span>{% if pct != "" %}<span class="badge text-bg-danger">-{{ pct }}%</span>{% endif %}</span>
{%- elsif pct != "" -%}
  <span class="badge text-bg-danger {{ include.class }}">-{{ pct }}%</span>
{%- endif -%}

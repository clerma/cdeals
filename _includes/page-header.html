<nav class="container pt-3 my-3 my-md-4" aria-label="breadcrumb">
  {% if include.col_class %}<div class="row justify-content-center"><div class="{{ include.col_class }}">{% endif %}
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ '/' | relative_url }}">{{ site.data.strings.breadcrumbs.home }}</a></li>
    {% if include.parent_url %}<li class="breadcrumb-item"><a href="{{ include.parent_url | relative_url }}">{{ include.parent }}</a></li>{% endif %}
    <li class="breadcrumb-item active" aria-current="page">{{ include.title }}</li>
  </ol>
  {% if include.col_class %}</div></div>{% endif %}
</nav>

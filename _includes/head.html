<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{% include seo.html %}
<link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} feed" href="{{ '/feed.xml' | relative_url }}">
<link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" href="{{ '/assets/images/icon-32x32.png' | relative_url }}" sizes="32x32">
<link rel="icon" type="image/png" href="{{ '/assets/images/icon-192x192.png' | relative_url }}" sizes="192x192">
<link rel="apple-touch-icon" href="{{ '/assets/images/icon-180x180.png' | relative_url }}">

<!-- Light mode only: <html data-bs-theme="light"> is fixed in _layouts/default.html (no theme switcher). -->

<link rel="preload" href="{{ '/assets/fonts/inter-variable-latin_8100aab2.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/cartzilla-icons_1c2f5f0e.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/cartzilla-icons.min.css' | relative_url }}">
{% if page.swiper %}<link rel="stylesheet" href="{{ '/assets/css/swiper-bundle.min.css' | relative_url }}">{% endif %}
<link rel="stylesheet" href="{{ '/assets/css/theme.min.css' | relative_url }}" id="theme-styles">
<link rel="stylesheet" href="{{ '/assets/css/cdeals.css' | relative_url }}">
<style>
  .product-card.is-sold img { filter: grayscale(1); opacity: .55; }
  .product-thumb { width: 88px; cursor: pointer; }
  [data-category][hidden] { display: none !important; }
  .page-content h2 { font-size: 1.25rem; padding-top: 1rem; }
  .page-content h3 { font-size: 1.1rem; }
</style>

{% include auto-affiliate.html %}

{% assign anycart_items = site.products | where: "type", "sale" | where: "status", "available" %}
{% if site.anycart_api_key != "" and anycart_items.size > 0 %}
<!-- AnyCart: cart drawer + checkout, only while one of my own items is for sale.
     data-hide-button because the header has its own cart button. -->
<script src="https://cdn.anycart.dev/v1/anycart.js" data-api-key="{{ site.anycart_api_key }}" data-hide-button defer></script>
{% endif %}
<meta name='impact-site-verification' value='89615806-a37d-489a-aaa0-d99219747cf4'>

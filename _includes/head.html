<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{% feed_meta %}
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon-16x16.png' | relative_url }}">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" media="screen" href="{{ '/assets/vendor/simplebar/dist/simplebar.min.css' | relative_url }}">
<link rel="stylesheet" media="screen" href="{{ '/assets/vendor/tiny-slider/dist/tiny-slider.css' | relative_url }}">
<link rel="stylesheet" media="screen" href="{{ '/assets/css/theme.min.css' | relative_url }}">
{% if site.anycart_api_key != "" %}
<script src="https://cdn.anycart.dev/v1/anycart.js" data-api-key="{{ site.anycart_api_key }}" data-hide-button defer></script>
{% endif %}
<style>
  .product-card .card-img-top img { aspect-ratio: 1 / 1; object-fit: cover; width: 100%; }
  .product-card.is-sold .card-img-top img { filter: grayscale(1); opacity: .6; }
  .product-gallery-main img { aspect-ratio: 1 / 1; object-fit: cover; width: 100%; }
  .product-thumb { width: 72px; height: 72px; object-fit: cover; cursor: pointer; }
</style>

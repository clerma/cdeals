<header class="bg-light shadow-sm navbar-sticky">
  <div class="navbar navbar-expand-lg navbar-light">
    <div class="container">
      <a class="navbar-brand fw-bold fs-3 me-4 order-lg-1" href="{{ '/' | relative_url }}"><i class="ci-bag text-primary me-2"></i>{{ site.title }}</a>
      <div class="navbar-toolbar d-flex align-items-center order-lg-3">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
        <button class="btn btn-primary btn-shadow" type="button" data-anycart-open><i class="ci-cart me-2"></i>Cart <span class="badge bg-light text-dark rounded-pill ms-1" data-anycart-count>0</span></button>
      </div>
      <div class="collapse navbar-collapse me-auto order-lg-2" id="navbarCollapse">
        <hr class="my-3 d-lg-none">
        <ul class="navbar-nav">
          {% assign nav = "/|Home,/shop/|For sale,/deals/|Deals,/about/|About" | split: "," %}
          {% for item in nav %}
            {% assign parts = item | split: "|" %}
            <li class="nav-item{% if page.url == parts[0] %} active{% endif %}"><a class="nav-link" href="{{ parts[0] | relative_url }}">{{ parts[1] }}</a></li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</header>

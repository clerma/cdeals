# ---------------------------------------------------------------------------
# Site settings — edit these first
# ---------------------------------------------------------------------------
title: cDeals
tagline: Used tech I'm selling + the best deals I find
description: >-
  Hand-checked used tech for sale direct from me, plus tech deals I've found
  around the web.
author: Carlos Lerma
url: "https://cdeals.co"
baseurl: ""
contact_email: you@example.com # shown on item pages for questions

# Used by the Terms, Privacy, and Returns pages. Replace the [BRACKETED]
# placeholders before launch.
legal_name: "[YOUR FULL NAME OR BUSINESS NAME]"   # who runs the site / sells the items
governing_law_state: "[STATE, e.g. Texas — confirm]"
hosting_provider: "[HOSTING PROVIDER, e.g. CloudCannon / Netlify]"

# AnyCart (https://anycart.co) handles the cart and checkout for items you sell.
# Paste the public key from your AnyCart dashboard (starts with ac_live_).
anycart_api_key: ""

# Automatic affiliate links for deals from any store except Amazon.
# Fill in ONE of these (leave the other blank). With it set, a deal's
# affiliate_url can be a plain store link (woot.com/..., macsales.com/...)
# and it earns automatically. Amazon links still need your Associates tag.
sovrn_key: ""      # Sovrn Commerce: campaign API key (Settings > "<>" icon)
skimlinks_id: "310483X1798959"   # Skimlinks: publisher ID, e.g. 123456X1234567 (Settings > Install)

# Amazon Associates tracking ID, e.g. yourtag-20. The deal finder turns every
# Amazon link into https://www.amazon.com/dp/ASIN?tag=<this>.
amazon_tag: "cdeals014-20"
# Amazon Associates rules don't allow hand-entered static prices. With this
# false, Amazon deals show "Best deal seen on Amazon" + "See price at Amazon"
# instead of price / original price / -NN% (the numbers stay in front matter).
# Set to true to show them again.
amazon_show_prices: false
# TODO (optional): Geniuslink group ID. Not used yet; Amazon links stay
# plain amazon.com/dp links with your tag.
geniuslink_group: ""

# Shown in the footer and on every affiliate deal.
affiliate_disclosure: >-
  Some links on this site are affiliate links. If you buy through them I may
  earn a small commission at no extra cost to you.

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
permalink: pretty

collections:
  products:
    output: true
    permalink: /item/:name/
  deal_categories:          # one stub per category in _data/categories.yml
    output: true
    permalink: /deals/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: products
    values:
      layout: product
  - scope:
      path: ""
      type: deal_categories
    values:
      layout: category
      sitemap: true

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/bundle
  - cloudcannon.config.yml
  - scripts

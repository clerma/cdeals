# ---------------------------------------------------------------------------
# Site settings — edit these first
# ---------------------------------------------------------------------------
title: cDeals
tagline: Used tech I'm selling + the best deals I find
description: >-
  Hand-checked used tech for sale direct from me, plus tech deals I've found
  around the web.
author: Carlos Lerma
url: "" # e.g. https://cdeals.com
baseurl: ""
contact_email: you@example.com # shown on item pages for questions

# Shown in the footer and on every affiliate deal.
affiliate_disclosure: >-
  Some links on this site are affiliate links. If you buy through them I may
  earn a small commission at no extra cost to you.

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
permalink: pretty

collections:
  products:
    output: true
    permalink: /item/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: products
    values:
      layout: product

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# _pages holds the original Cartzilla demo pages. Underscore folders are not
# built, so they stay here only as copy-paste reference for new sections.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/bundle
  - cloudcannon.config.yml
  - assets/components
  - assets/docs

# ---------------------------------------------------------------------------
# Site settings — edit these first
# ---------------------------------------------------------------------------
title: cDeals
tagline: Used tech I'm selling + the best deals I find
description: >-
  Hand-checked used tech for sale direct from me, plus tech deals I've found
  around the web.
# Used instead of the two above while none of my own items is for sale
# (_plugins/selling_mode.rb). The selling wording comes back automatically
# when at least one sale item is published.
tagline_no_sale: The best tech deals I find
description_no_sale: >-
  Hand-checked tech deals from Amazon, B&H, Target, Newegg, Woot, and more,
  picked by a real person.
# Used instead of description_no_sale while only Amazon deals are shown
# (affiliate_networks below).
description_no_sale_amazon_only: >-
  Hand-checked tech deals on Amazon, picked by a real person.
author: Carlos Lerma
url: "https://cdeals.co" # production domain: every canonical URL and schema @id is built from it
lang: en_US
currency: USD   # prices in _products are in this currency (used in Product schema)
logo: "/assets/images/brand/logo-horizontal.svg"  # Organization schema / default share image
baseurl: ""
contact_email: hello@cdeals.co # legal contact in Terms only — UI Email me / Contact use the /contact/ form

# Used by the Terms, Privacy, and Returns pages. Replace the [BRACKETED]
# placeholders before launch.
legal_name: "[YOUR FULL NAME OR BUSINESS NAME]"   # who runs the site / sells the items
governing_law_state: "[STATE, e.g. Texas — confirm]"
hosting_provider: "[HOSTING PROVIDER, e.g. CloudCannon / Netlify]"

# AnyCart (https://anycart.co) handles the cart and checkout for items you sell.
# Paste the public key from your AnyCart dashboard (starts with ac_live_).
anycart_api_key: ""

# Automatic affiliate links for deals from any store except Amazon.
# Fill in ONE of these (leave the other blank). With it set, a deal's
# affiliate_url can be a plain store link (woot.com/..., macsales.com/...)
# and it earns automatically. Amazon links still need your Associates tag.
sovrn_key: ""      # Sovrn Commerce: campaign API key (Settings > "<>" icon)
skimlinks_id: "310483X1798959"   # Skimlinks: publisher ID, e.g. 123456X1234567 (Settings > Install)

# Which affiliate networks are earning. Skimlinks is still pending approval,
# so deals at any store other than Amazon earn nothing yet, but they're shown
# anyway. Set skimlinks_active to false to hide them from the whole site
# again (no /item/ page, card, filter, sitemap or llms.txt entry; empty
# category pages are skipped). The deal finder keeps saving them to
# _products/ either way. The switch is _plugins/affiliate_networks.rb.
affiliate_networks:
  skimlinks_active: true

# Prime Day (Prime Big Deal Days, Oct 6-7, 2026). While active is true and
# today (America/Chicago) is before `ends`, the home page shows a "Best Prime
# Day Deals" section (only with 4+ deals) and the menu / category pills link
# /deals/prime-day/. It lists Amazon deals with `prime_day: true` in front
# matter (the deal finder adds it when the source mentions Prime Day or a
# Prime-members price). Set active to false, or let `ends` pass, and all of
# that disappears; /deals/prime-day/ then says Prime Day has ended (noindex,
# not in the sitemap). The switch is _plugins/prime_day.rb.
prime_day:
  active: true
  ends: 2026-10-08     # first day AFTER the event; hide from this date on

# Amazon Associates tracking ID, e.g. yourtag-20. The deal finder turns every
# Amazon link into https://www.amazon.com/dp/ASIN?tag=<this>.
amazon_tag: "cdeals014-20"
# When true, Amazon deals show the stored front-matter price. Strikethrough /
# -NN% only when compare_at is also present and higher (from the deal source —
# never invent MSRP). CTA is always "See the savings on Amazon". When false,
# hide numbers and show badge + CTA only.
amazon_show_prices: true
# Geniuslink: sends Amazon shoppers outside the US to their local Amazon
# store (international Associates tags are set on the Geniuslink Affiliates
# page). Links stay plain amazon.com/dp links with amazon_tag; the Geniuslink
# script (_includes/auto-affiliate.html) only wraps Amazon links. Other stores
# stay on Skimlinks. API keys (GENIUSLINK_API_KEY / GENIUSLINK_API_SECRET) are
# only for optional tools and live in the environment, never in this repo.
geniuslink:
  active: true
  group: "445281"            # Group TSID (Geniuslink > Groups; "default" group). Change it here or in CloudCannon.
  domain: ""                 # blank = geni.us; set only for a custom Geniuslink domain, e.g. https://go.example.com
  honor_existing_tag: true   # keep the amazon_tag already on our links
  preserve_until_click: true # amazon.com link until clicked (Amazon-compliant); false = rewrite links on page load

# Shown in the footer and on every affiliate deal.
affiliate_disclosure: >-
  Some links on this site are affiliate links. If you buy through them I may
  earn a small commission at no extra cost to you.

# Analytics and ad tracking. Each loads only when its ID is filled in
# (see _includes/tracking.html). The Privacy page updates itself to match.
google_analytics: "G-1HZ57TYMV3"   # GA4 measurement ID, e.g. G-XXXXXXXXXX
facebook_pixel: ""     # Meta Pixel ID (numbers only)
clarity_id: ""         # Microsoft Clarity project ID

# SEO: search console verification codes (emitted only when filled in)
google_site_verification: ""
bing_site_verification: ""
# Google Analytics 4 measurement ID (gtag.js tag in _includes/seo.html). Leave empty to turn analytics off.
google_analytics: "G-1HZ57TYMV3"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
permalink: pretty

# Scheduled posts. Jekyll's default is already false; it's set explicitly so a
# post dated in the future stays off the live site until a build runs on/after
# that date. CloudCannon runs a plain `jekyll build` (no --future), so it
# honors this.
future: false

# The jekyll-cloudcannon-schedule plugin writes /_schedule.txt listing every
# future-dated post. CloudCannon reads it after each build and schedules a
# build at each post's time (Site Settings > Schedule > Automatic).
# _plugins/cloudcannon_schedule_extras.rb adds a build for the Prime Day
# `ends` date (00:05 Central) and for each entry below.
# Extra one-off builds CloudCannon should run (written to _schedule.txt).
# time is Central time "YYYY-MM-DD HH:MM"; past times are ignored.
# To add one, change the line to `scheduled_builds:` and add entries like:
scheduled_builds: []
#  - time: "2026-12-01 00:05"
#    name: Holiday page goes live
#    file: index.html              # optional; defaults to _config.yml

# Post dates and "today" checks use Central time even on UTC build servers.
timezone: America/Chicago

collections:
  products:
    output: true
    permalink: /item/:name/
  deal_categories:          # one stub per category in _data/categories.yml
    output: true
    permalink: /deals/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: products
    values:
      layout: product
  - scope:
      path: ""
      type: deal_categories
    values:
      layout: category
      sitemap: true
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Carlos Lerma
      sitemap: true
      permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-cloudcannon-schedule

# RSS (jekyll-feed): /feed.xml
feed:
  path: feed.xml
  excerpt_only: true
  posts_limit: 20

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/bundle
  - vendor
  - cloudcannon.config.yml
  - scripts
  - tmp
  - .cloudcannon
  - .bundle
